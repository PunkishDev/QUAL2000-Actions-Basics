#Name the workflow
name: CI and Testing

#Trigger to run the workflow
on:
  push:
    branches: [master, main, **]
  pull_request:
    branches: master
  
#Job to run
jobs:
  #name of the job
  build:
    #The type of runner machine
    runs-on: ubuntu-latest

    #Steps we want to run on the runner machine
    steps:
      #step-1: checkout the code from the repo (download the repo on the runner)
      - uses: actions/checkout@v4

      #step-2: set up Node.js environment on the runner
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      
      #step-3: Install the repo's dependencies from package.json
      - name: Install dependencies
        run: npm i

      #step-4: Run the unit and integration tests
      - name: Run Tests
        run: npm test
      